<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<link rel="stylesheet" href="register.css">

</head>

<body>

<div class="container">

<div class="card">

<h2>Library Registration</h2>

<form id="registerForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="text"
id="mobile"
placeholder="Mobile Number"
required>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Register

</button>

</form>

<p>

Already Registered?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

<script src="register.js"></script>

</body>

</html>
