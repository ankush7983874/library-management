<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Library Settings</title>

<link rel="stylesheet" href="settings.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="topbar">

<button id="backBtn">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</button>

<h1>Library Settings</h1>

</div>

<form>

<div class="card">

<h2>Library Information</h2>

<label>Library Name</label>

<input type="text" value="BarnalaByte Smart Library">

<label>Owner Name</label>

<input type="text" value="Ankush Barnala">

<label>Mobile Number</label>

<input type="text" value="9876543210">

<label>Email</label>

<input type="email" value="owner@gmail.com">

</div>

<div class="card">

<h2>Library Timing</h2>

<label>Opening Time</label>

<input type="time" value="07:00">

<label>Closing Time</label>

<input type="time" value="22:00">

</div>

<div class="card">

<h2>Payment</h2>

<label>UPI ID</label>

<input type="text" placeholder="barnalabyte@upi">

<label>QR Code</label>

<input type="file">

</div>

<div class="card">

<h2>Library Images</h2>

<input type="file" multiple>

</div>

<button class="saveBtn">

Save Settings

</button>

</form>

</div>

<script src="settings.js"></script>

</body>

</html>
