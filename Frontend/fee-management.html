<!DOCTYPE html>

    <div class="container">
        <h1 class ="title"> fee management</h1>

            <tbody>

                <tr>

                    <td>
                        <img src="https://i.pravatar.cc/50?img=1">
                    </td>

                    <td>Rahul Kumar</td>

                    <td>
                        <span class="paid">

                    </td>

                    </td>

                </tr>

                <tr>

                    <td>
                        <img src="https://i.pravatar.cc/50?img=2">
                    </td>

</div>
