<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Student Account | BarnalaByte Smart Library</title>
    <link rel="stylesheet" href="student-register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="register-wrapper">
        <div class="neumorphic-card">

            <!-- Top Circular Embossed Icon Container -->
            <div class="top-icon-container">
                <div class="icon-circle">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
            </div>

            <!-- Title & Subtitle -->
            <div class="title-header">
                <h2>Create Account</h2>
                <p>Join BarnalaByte Smart Library</p>
            </div>

            <!-- Error / Status Alert Box -->
            <div id="alertBox" class="alert-box" style="display: none;"></div>

            <!-- Registration Form -->
            <form id="registerForm" enctype="multipart/form-data">

                <!-- SECTION 1: Personal Details -->
                <div class="form-section">
                    <h3 class="section-title"><i class="fa-solid fa-id-card"></i> Personal Details</h3>
                    <div class="grid-2">
                        <div class="input-group">
                            <label for="fullName">Full Name <span class="req">*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-user input-icon"></i>
                                <input type="text" id="fullName" placeholder="Enter full name" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="fatherName">Father's Name <span class="req">*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-user-tie input-icon"></i>
                                <input type="text" id="fatherName" placeholder="Enter father's name" required>
                            </div>
                        </div>
                    </div>

                    <div class="grid-3">
                        <div class="input-group">
                            <label for="motherName">Mother's Name</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-user-nurse input-icon"></i>
                                <input type="text" id="motherName" placeholder="Enter mother's name">
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="gender">Gender <span class="req">*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-venus-mars input-icon"></i>
                                <select id="gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="dob">Date of Birth <span class="req">*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-calendar input-icon"></i>
                                <input type="date" id="dob" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SECTION 2: Contact Details & Email OTP -->
                <div class="form-section">
                    <h3 class="section-title"><i class="fa-solid fa-envelope"></i> Contact & Email Verification</h3>
                    
                    <div class="grid-2">
                        <div class="input-group">
                            <label for="mobile">Mobile Number <span class="req">*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-phone input-icon"></i>
                                <input type="tel" id="mobile" placeholder="Enter 10-digit mobile" maxlength="10" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="email">Email Address (OTP Required) <span class="req">*</span></label>
                            <div class="input-wrapper-btn">
                                <div class="input-wrapper flex-1">
                                    <i class="fa-solid fa-at input-icon"></i>
                                    <input type="email" id="email" placeholder="Enter email address" required>
                                </div>
                                <button type="button" id="sendOtpBtn" class="neu-action-btn">
                                    Send OTP
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- OTP Verification Sub-Box -->
                    <div id="otpContainer" class="neu-sub-box" style="display: none;">
                        <div class="input-wrapper-btn">
                            <div class="input-wrapper flex-1">
                                <i class="fa-solid fa-shield-halved input-icon"></i>
                                <input type="text" id="otpInput" placeholder="Enter 6-digit Email OTP" maxlength="6">
                            </div>
                            <button type="button" id="verifyOtpBtn" class="neu-success-btn">
                                Verify OTP
                            </button>
                        </div>
                        <div id="otpStatus" class="status-msg"></div>
                    </div>

                    <div class="input-group" style="margin-top: 14px;">
                        <label for="address">Residential Address</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-location-dot input-icon" style="top: 16px;"></i>
                            <textarea id="address" placeholder="Enter full permanent/current address" rows="2"></textarea>
                        </div>
                    </div>
                </div>

                <!-- SECTION 3: Education Details -->
                <div class="form-section">
                    <h3 class="section-title"><i class="fa-solid fa-graduation-cap"></i> Academic Details</h3>
                    <div class="grid-2">
                        <div class="input-group">
                            <label for="college">College / School Name</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-school input-icon"></i>
                                <input type="text" id="college" placeholder="Enter college or school name">
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="course">Course / Target Exam</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-book-open input-icon"></i>
                                <input type="text" id="course" placeholder="e.g. B.Tech / UPSC / NEET">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SECTION 4: Account Security -->
                <div class="form-section">
                    <h3 class="section-title"><i class="fa-solid fa-lock"></i> Account Security</h3>
                    <div class="grid-2">
                        <div class="input-group">
                            <label for="password">Password <span class="req">*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-key input-icon"></i>
                                <input type="password" id="password" placeholder="Create password" required>
                                <button type="button" id="togglePassBtn1" class="eye-toggle-btn">
                                    <i id="eyeIcon1" class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="confirmPassword">Confirm Password <span class="req">*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-key input-icon"></i>
                                <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                                <button type="button" id="togglePassBtn2" class="eye-toggle-btn">
                                    <i id="eyeIcon2" class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SECTION 6: Profile Photo -->
                <div class="form-section">
                    <h3 class="section-title"><i class="fa-solid fa-image"></i> Profile Passport Photo</h3>
                    <div class="photo-upload-box">
                        <div class="photo-preview-container">
                            <img id="photoPreview" src="ankush photo.png" alt="Preview">
                        </div>
                        <div class="photo-input-col">
                            <label for="photo" class="neu-upload-label">
                                <i class="fa-solid fa-cloud-arrow-up"></i> Choose Photo File
                            </label>
                            <input type="file" id="photo" accept="image/*" style="display: none;">
                            <span id="fileNameDisplay" class="file-name">No file selected</span>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="login-btn">
                    <span id="btnText">CREATE ACCOUNT</span>
                </button>

            </form>

            <!-- Bottom Navigation -->
            <div class="signup-section">
                <span>Already have an account?</span>
                <a href="student-login.html" class="login-link-btn">
                    Login <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>

        </div>
    </div>

    <script src="student-register.js"></script>

</body>

</html>
