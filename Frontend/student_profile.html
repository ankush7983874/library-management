<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <link rel="stylesheet" href="student-profile.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="profile-card">

        <img id="profilePhoto" src="ankush photo.png" class="profile-img">

        <h2 id="fullName">Loading...</h2>

        <p id="course">Loading...</p>

        <span class="badge" id="accountStatus">Active</span>

    </div>

    <div class="details">

        <h2>Personal Details</h2>

        <div class="grid">

            <div class="box">
                <label>Student ID</label>
                <p id="studentId">Loading...</p>
            </div>

            <div class="box">
                <label>Seat Number</label>
                <p id="seatNumber">Loading...</p>
            </div>

            <div class="box">
                <label>Mobile</label>
                <p id="mobile">Loading...</p>
            </div>

            <div class="box">
                <label>Email</label>
                <p id="email">Loading...</p>
            </div>

            <div class="box">
                <label>College</label>
                <p id="college">Loading...</p>
            </div>

            <div class="box">
                <label>Father Name</label>
                <p id="fatherName">Loading...</p>
            </div>

            <div class="box">
                <label>Mother Name</label>
                <p id="motherName">Loading...</p>
            </div>

            <div class="box">
                <label>Gender</label>
                <p id="gender">Loading...</p>
            </div>

            <div class="box">
                <label>Date of Birth</label>
                <p id="dob">Loading...</p>
            </div>

            <div class="box">
                <label>Address</label>
                <p id="address">Loading...</p>
            </div>

            <div class="box">
                <label>Fees Status</label>
                <p id="feesStatus">Loading...</p>
            </div>

            <div class="box">
                <label>Joining Date</label>
                <p id="joiningDate">Loading...</p>
            </div>

        </div>

        <div class="buttons">

            <button id="editBtn">
                <i class="fa-solid fa-pen"></i>
                Edit Profile
            </button>

            <button id="dashboardBtn">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </button>

        </div>

    </div>

</div>

<script src="student-profile.js"></script>

</body>
</html>
