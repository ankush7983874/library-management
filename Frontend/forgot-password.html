<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | BarnalaByte Library</title>
    <link rel="stylesheet" href="forgot-password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">
    <div class="card">
        <i class="fa-solid fa-lock icon"></i>
        <h2>Forgot Password</h2>
        <p>Select your Account Type and enter your registered Email</p>

        <form id="forgotForm">
            <select id="userType" style="width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px;" required>
                <option value="student">Student Account</option>
                <option value="owner">Library Owner Account</option>
            </select>

            <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                <input type="email" id="email" placeholder="Registered Email Address" required style="flex: 1; margin: 0;">
                <button type="button" id="sendOtpBtn" style="width: auto; padding: 0 14px; white-space: nowrap; font-size: 13px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Send OTP</button>
            </div>

            <div id="otpBox" style="display: none; flex-direction: column; gap: 6px; margin-bottom: 12px; background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px dashed #cbd5e1;">
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="otpInput" placeholder="Enter 6-Digit OTP" maxlength="6" style="flex: 1; margin: 0;">
                    <button type="button" id="verifyOtpBtn" style="width: auto; padding: 0 14px; white-space: nowrap; font-size: 13px; background: #16a34a; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Verify OTP</button>
                </div>
                <small id="otpStatus" style="font-size: 12px; font-weight: 600; text-align: left;"></small>
            </div>

            <div id="passwordBox" style="display: none; flex-direction: column; gap: 10px; margin-bottom: 12px;">
                <input type="password" id="newPassword" placeholder="New Password" required style="margin: 0;">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required style="margin: 0;">
                <button type="submit" id="resetBtn" style="width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Reset Password</button>
            </div>
        </form>

        <a href="student-login.html" style="display: inline-block; margin-top: 15px;">Back to Login</a>
    </div>
</div>

<script src="forgot-password.js"></script>

</body>
</html>
